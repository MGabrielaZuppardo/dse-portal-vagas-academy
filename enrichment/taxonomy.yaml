# Taxonomia de skills técnicas.
#
# id:        identificador canônico (snake_case, estável: é o que vai para o banco)
# nome:      forma de exibição, também enviada ao LLM como vocabulário sugerido
# categoria: agrupamento para o dashboard
# sinonimos: variações PT/EN que o LLM ou a vaga podem usar. A comparação ignora
#            maiúsculas, acentos, espaços, hífens, pontos e sublinhados
#            ("Power-BI" == "powerbi"), então não é preciso listar essas variações.
# pai:       (opcional) skill mais ampla que também é contada. Ex.: AWS Glue -> AWS.
#
# Skills que o LLM extrair e não casarem com nada daqui vão para
# `skills_nao_mapeadas`; revise periodicamente e promova as frequentes.

versao: 1

# Termos que continuam valendo para mapear a saída do LLM, mas NÃO são procurados
# no texto livre da vaga (extração por palavra-chave), porque também são palavras
# comuns em português/inglês ou nomes de empresas ("informática", "a ponta do
# iceberg", "Shell"). A skill ainda é encontrada pelas formas longas
# ("AWS Lambda", "Microsoft Fabric", "Informatica PowerCenter").
# A linguagem R tem regra própria no código (letra maiúscula isolada).
ignorar_na_busca_textual:
  - R
  - CI
  - CD
  - BQ
  - Delta
  - DLT
  - Fabric
  - Lambda
  - Composer
  - Vertex
  - Elastic
  - Torch
  - Shell
  - Macros
  - REST
  - DW
  - PDI
  - planilhas
  - containers
  - contêineres
  - experimentação
  - M language
  - Linguagem M
  - Informatica
  - Iceberg
  - Mongo

